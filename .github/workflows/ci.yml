name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lensmu/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: lensmu/extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lensmu/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: lensmu/website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lensmu/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: lensmu/extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/lensmu-browser-tools" --no-save --package-lock=false playwright@1.62.1
      - run: node "$RUNNER_TEMP/lensmu-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - run: PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/lensmu-browser-tools/node_modules/playwright/index.mjs" BROWSER_ARTIFACTS="$RUNNER_TEMP/lensmu-browser-artifacts" node test/browser/acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-browser-acceptance
          path: ${{ runner.temp }}/lensmu-browser-artifacts
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lensmu/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            lensmu/backend/requirements*.txt
            lensmu/backend/constraints/core.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -v
